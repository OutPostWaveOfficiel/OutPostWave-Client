[package]
name = "ow-app"
description = "OutpostWave desktop and mobile client (Tauri 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo issue #8519).
name = "ow_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ow-identity = { path = "../../crates/identity" }
ow-messaging = { path = "../../crates/messaging" }
ow-p2p = { path = "../../crates/p2p" }
ow-storage = { path = "../../crates/storage", features = ["os-keystore"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tokio = { version = "1", features = ["sync"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
