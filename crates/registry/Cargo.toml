[package]
name = "ow-registry"
description = "Client of the OutpostWave account registry (usernames, search, recovery, backups)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23"
ow-crypto = { path = "../crypto" }
ow-identity = { path = "../identity" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
